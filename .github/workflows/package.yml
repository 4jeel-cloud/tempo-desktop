name: package

# Builds the Linux Debian package and the Windows installer, then attaches both to a GitHub
# Release, so a friend downloads tempo-desktop_<version>_amd64.deb (Linux) or
# Tempo-Desktop-Setup.exe (Windows) from the Releases page and installs it with no toolchain and
# no setup. Runs when a `v*` or `tempo-v*` tag is pushed, or by hand from the Actions tab.
on:
  push:
    tags: ["v*", "tempo-v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deb:
    name: debian package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake mold fakeroot dpkg-dev \
            libasound2-dev libfontconfig1-dev libfreetype-dev libsqlite3-dev \
            libx11-dev libxcb1-dev libxcursor-dev libxi-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libvulkan-dev libdbus-1-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: build the package
        run: ./scripts/package-deb.sh

      - name: checksum
        run: |
          cd dist
          sha256sum ./*.deb > SHA256SUMS

      - name: upload the package
        uses: actions/upload-artifact@v4
        with:
          name: deb
          path: |
            dist/*.deb
            dist/SHA256SUMS

      - name: attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.deb
            dist/SHA256SUMS

  windows:
    name: windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: build the executable
        run: cargo build --locked --release --package sonora --target x86_64-pc-windows-msvc

      - name: install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: build the installer
        shell: pwsh
        env:
          TARGET: x86_64-pc-windows-msvc
          SETUP: Tempo-Desktop-Setup
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' |
            Select-Object -First 1).Matches.Groups[1].Value
          if ($version -notmatch '^\d+\.\d+\.\d+') { $version = "0.0.0" }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $env:SONORA_VERSION = $version
          $env:SONORA_ARCH = "x64compatible"
          $env:SONORA_SETUP = $env:SETUP
          $env:SONORA_EXE = (Resolve-Path "target/$env:TARGET/release/sonora.exe").Path
          $env:SONORA_DIST = (Resolve-Path "dist").Path
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "scripts/windows/sonora.iss"

      - name: checksum
        shell: bash
        run: |
          cd dist
          sha256sum ./*.exe > SHA256SUMS-windows

      - name: upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.exe
            dist/SHA256SUMS-windows

      - name: attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/SHA256SUMS-windows
